[tool.poetry]
name = "spotify-matrix"
version = "0.2.0"
description = "Spotify album art matrix display with FastAPI setup UI"
readme = "README.md"
authors = ["rohanyf <rohan@yummyfuture.wiki>"]
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
pillow = ">=10.0,<11.0"
python-dotenv = ">=1.0"
requests = ">=2.31"
fastapi = "^0.115.0"
uvicorn = ">=0.30.0"
pydantic = "^2.10.0"
toml = "^0.10.2"
loguru = "^0.7.3"

[tool.poetry.group.test.dependencies]
pytest = "^8.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.isort]
line_length = 200
profile = "black"

[tool.black]
line-length = 200

[tool.ruff]
line-length = 200

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
