[app]
id = "core.pacman"
name = "Pac-Man"
version = "1.0.0"
summary = "Clear the maze while four ghosts hunt you down."
author = "Assistant Matrix"
category = "games"
runtime = "python"
entrypoint = "renderer.app:PacmanGame"
matrix_size = "64x64"
license = "MIT"
kind = "game"
layout = "dpad"
actions = ["up", "down", "left", "right", "pause", "resume", "togglePause", "restart"]

[preview]
card_gif = "previews/card.gif"
matrix_png = "previews/matrix-64.png"
description = ""

[[config]]
key = "speed"
label = "Pac-Man speed"
type = "number"
required = false
default = 5.5
placeholder = ""
helpText = "Tiles per second. Ghosts scale with this."
min = 3
max = 9
step = 0.5

[[config]]
key = "lives"
label = "Lives"
type = "number"
required = false
default = 3
placeholder = ""
helpText = ""
min = 1
max = 5
step = 1

[[config]]
key = "frightSeconds"
label = "Power pellet seconds"
type = "number"
required = false
default = 7
placeholder = ""
helpText = ""
min = 2
max = 15
step = 1
