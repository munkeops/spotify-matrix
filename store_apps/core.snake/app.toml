[app]
id = "core.snake"
name = "Snake"
version = "1.0.0"
summary = "Eat, grow, and do not bite yourself."
author = "Assistant Matrix"
category = "games"
runtime = "python"
entrypoint = "renderer.app:SnakeGame"
matrix_size = "64x64"
license = "MIT"
kind = "game"
layout = "dpad"
actions = ["up", "down", "left", "right", "pause", "resume", "togglePause", "restart"]

[preview]
card_gif = "previews/card.gif"
matrix_png = "previews/matrix-64.png"
description = ""

[[config]]
key = "speed"
label = "Starting speed"
type = "number"
required = false
default = 6
placeholder = ""
helpText = "Cells per second. Speeds up as you eat."
min = 2
max = 14
step = 1

[[config]]
key = "walls"
label = "Walls are deadly"
type = "boolean"
required = false
default = true
placeholder = ""
helpText = "Turn off to wrap around the edges instead."
