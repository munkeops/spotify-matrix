[app]
id = "core.tetris"
name = "Tetris"
version = "1.0.0"
summary = "Stack falling tetrominoes and clear lines."
author = "Assistant Matrix"
category = "games"
runtime = "python"
entrypoint = "renderer.app:TetrisGame"
matrix_size = "64x64"
license = "MIT"
kind = "game"
layout = "tetris"
actions = ["left", "right", "softDrop", "hardDrop", "rotateCw", "rotateCcw", "hold", "pause", "resume", "togglePause", "restart"]

[preview]
card_gif = "previews/card.gif"
matrix_png = "previews/matrix-64.png"
description = ""

[[config]]
key = "startLevel"
label = "Starting level"
type = "number"
required = false
default = 1
placeholder = ""
helpText = "Higher levels start with faster gravity."
min = 1
max = 15
step = 1

[[config]]
key = "ghost"
label = "Show landing preview"
type = "boolean"
required = false
default = true
placeholder = ""
helpText = ""

[[config]]
key = "autoRestartSeconds"
label = "Auto restart seconds"
type = "number"
required = false
default = 0
placeholder = ""
helpText = "Seconds to wait after game over before dealing a new board. 0 waits for the restart button."
min = 0
max = 120
step = 1
