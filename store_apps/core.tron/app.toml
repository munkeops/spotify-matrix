[app]
id = "core.tron"
name = "Tron"
version = "1.0.0"
summary = "Light cycles. Cut them off before they cut you off."
author = "Assistant Matrix"
category = "games"
runtime = "python"
entrypoint = "renderer.app:TronGame"
matrix_size = "64x64"
license = "MIT"
kind = "game"
layout = "dpad"
actions = ["up", "down", "left", "right", "pause", "resume", "togglePause", "restart"]

[preview]
card_gif = "previews/card.gif"
matrix_png = "previews/matrix-64.png"
description = ""

[[config]]
key = "speed"
label = "Speed"
type = "number"
required = false
default = 12
placeholder = ""
helpText = "Cells per second. Rises each round."
min = 5
max = 25
step = 1

[[config]]
key = "difficulty"
label = "Rival"
type = "select"
required = false
default = "normal"
placeholder = ""
options = [{ label = "Careless", value = "easy" }, { label = "Looks ahead", value = "normal" }, { label = "Hunts you", value = "hard" }]
helpText = ""

[[config]]
key = "rounds"
label = "Rounds to win"
type = "number"
required = false
default = 3
placeholder = ""
helpText = ""
min = 1
max = 9
step = 1
