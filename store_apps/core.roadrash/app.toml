[app]
id = "core.roadrash"
name = "Road Rash"
version = "1.0.0"
summary = "Race the pack, and throw an elbow when you draw level."
author = "Assistant Matrix"
category = "games"
runtime = "python"
entrypoint = "renderer.app:RoadRashGame"
matrix_size = "64x64"
license = "MIT"
kind = "game"
layout = "horizontal"
actions = ["left", "right", "up", "down", "fire", "pause", "resume", "togglePause", "restart"]

[preview]
card_gif = "previews/card.gif"
matrix_png = "previews/matrix-64.png"
description = ""

[[config]]
key = "distance"
label = "Race length"
type = "number"
required = false
default = 1500
placeholder = ""
helpText = "Metres to the finish."
min = 400
max = 5000
step = 100

[[config]]
key = "rivals"
label = "Rivals"
type = "number"
required = false
default = 5
placeholder = ""
helpText = ""
min = 1
max = 9
step = 1

[[config]]
key = "topSpeed"
label = "Top speed"
type = "number"
required = false
default = 60
placeholder = ""
helpText = ""
min = 30
max = 110
step = 5

[[config]]
key = "combat"
label = "Allow attacks"
type = "boolean"
required = false
default = true
placeholder = ""
helpText = "Draw level with a rival and hit fire."
